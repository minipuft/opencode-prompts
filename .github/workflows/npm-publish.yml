name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z release tag to republish after a workflow-only failure
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          submodules: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag/version alignment
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          sha="$(git rev-parse HEAD)"

          # Parse version from 'vX.Y.Z'
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version_from_tag="${BASH_REMATCH[1]}"
          else
            echo "Unexpected tag format: $tag"
            exit 1
          fi

          version_from_pkg="$(node -p "require('./package.json').version")"
          if [[ "$version_from_pkg" != "$version_from_tag" ]]; then
            echo "Version mismatch: tag=$version_from_tag package.json=$version_from_pkg"
            exit 1
          fi

          # Check changelog entry exists
          if ! grep -q "## \\[${version_from_tag}\\]" CHANGELOG.md 2>/dev/null; then
            echo "Missing changelog entry for ${version_from_tag} in CHANGELOG.md"
            exit 1
          fi

          # Guardrail: only publish releases whose tag commit is on main
          # The tag checkout is shallow. Fetch full main history so an older release
          # tag is not rejected merely because its ancestry is outside depth 1.
          git fetch origin main --unshallow
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Refusing to publish: tag commit is not on main (sha=$sha)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package policy fixtures
        run: npm run verify:package-artifact:self-test

      - name: Build and verify one exact tarball
        run: npm run verify:package-artifact -- --pack-destination artifacts

      - name: Upload verified tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-npm-tarball
          path: artifacts/*.tgz
          if-no-files-found: error

      - name: Publish the verified tarball with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(./artifacts/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected one verified tarball, found ${#tarballs[@]}"
            exit 1
          fi
          npm publish "${tarballs[0]}" --access public --provenance
